<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f2f2f0;font-family:Arial,sans-serif;color:#111">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border-top:5px solid #006a4e">
            <tr>
              <td style="padding:28px">

                <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#006a4e;color:#fff;text-decoration:none;font-weight:700;padding:13px 18px">Sign in securely</a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#777">If you did not request this link, you can ignore this email.</p>
              </td>

          </table>
